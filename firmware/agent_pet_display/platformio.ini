[platformio]
default_envs = waveshare_rlcd

[env:waveshare_rlcd]
; Pinned to what built the June firmware (Arduino-ESP32 2.0.17 / IDF 4.4.7).
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  olikraus/U8g2@2.36.18

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
  -<*>
  +<bridge_client.cpp>
  +<battery_monitor.cpp>
  +<button_actions.cpp>
  +<doto_font.cpp>
  +<focus_controller.cpp>
  +<pet_sprites.cpp>
  +<pet_state_machine.cpp>
  +<screen_layout.cpp>
  +<usage_visuals.cpp>
  +<clock_model.cpp>
  +<time_keeper.cpp>
  +<device_settings.cpp>
  +<anim_codec.cpp>
lib_deps =
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -std=gnu++17
